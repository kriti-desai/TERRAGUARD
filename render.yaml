services:
  - type: web
    name: terraguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: "production"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "https://terraguard.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        value: "sqlite:///./terraguard.db"
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
